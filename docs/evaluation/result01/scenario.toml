# Two bot workers, colocated onto two already-provisioned hosts (001/002) --
# `bot` adds no vCPUs of its own (just another container on the same VM),
# so this doesn't touch either region's 3-vCPU-per-region quota. Each bot
# gets its own host (a scenario action's `host` field picks a bot WORKER by
# host id, not a specific colocated instance -- two bot workers on the same
# host would be ambiguous).
[[workers]]
host = "001"
service = "bot"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "eastus"

[[workers]]
host = "002"
service = "bot"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "westus2"

# bot1 creates the room; bot2 joins the SAME room 5s later and streams
# alongside it. Both stay in the room for 10 minutes (+600s) before tearing
# down.
[[actions]]
id = "room0"
type = "bot.create_room"
timestamp = "+0s"
host = "001"
media_mode = "both"

[[actions]]
id = "room0_bot2"
type = "bot.join_room"
timestamp = "+5s"
host = "002"
room_id = "$room0.roomId"
media_mode = "both"

[[actions]]
type = "bot.delete_room"
timestamp = "+600s"
host = "001"
bot_id = "$room0.botId"

[[actions]]
type = "bot.delete_room"
timestamp = "+600s"
host = "002"
bot_id = "$room0_bot2.botId"

