name = "azure-devnet-sample"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

# Reuse the DigitalOcean-hosted registry -- images are already published there
# (scenario/example/digitalocean.toml); pushing the same images to a second,
# separately-billed registry would be pure waste. Azure instances just pull
# from it like any other host.
[registry]
provider = "digitalocean"
tag = ""

# Same shared static frontend bucket digitalocean.toml points at (see that
# file's [[frontends]] entry) -- this scenario had none before, so it
# provisioned no client frontend at all.
[[frontends]]
name = "site-2-bucket"
object = "frontend"
provider = "alibaba"

# Uniform topology: every host runs 1 relay + 2 cp-daemon + 2 validator-daemon
# (5 colocated containers on one VM). One host per Azure region, each on
# Standard_D2als_v7 (2 vCPU -- see cli/infra/_constants.py's VM_INSTANCE_SIZES
# comment on why this is the floor SKU for this subscription) -- keeps every
# region's total at 2 vCPU, under this subscription's 3-vCPU-per-region cap.
# Do NOT add a second host to any region already used below without also
# shrinking VM size, or that region's total crosses the 3-vCPU limit.
# (signaling is deprecated/removed -- not part of this topology.)

# --- host 001 (region EXPLICIT below, "eastus" -- do NOT leave this unset:
# this subscription's actual azure default is "eastus2" (secrets/cloud/
# azure.env's AZURE_LOCATION=eastus2), NOT the "eastus" hardcoded fallback
# in IaC/pulumi/app/common/regions.py, and host 005 below already lives in
# eastus2. Confirmed live: an earlier version of this file left host 001's
# region unset, so it silently collided with host 005 in eastus2 and blew
# the 3-vCPU-per-region LowPriorityCores quota (2+2=4>3, host 001's VM
# create failed with OperationNotAllowed) -- host 005 was already
# successfully provisioned by then, so host 001 is the one pinned to a
# still-free region instead, not host 005.) --------------------------------
[[workers]]
host = "001"
service = "relay"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "eastus"

[[workers]]
host = "001"
service = "cp-daemon"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "eastus"

[[workers]]
host = "001"
service = "cp-daemon"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 2
region = "eastus"

[[workers]]
host = "001"
service = "validator-daemon"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "eastus"

[[workers]]
host = "001"
service = "validator-daemon"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 2
region = "eastus"

