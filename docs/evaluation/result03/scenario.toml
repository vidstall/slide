size = "Standard_D2als_v7"
worker_index = 1
region = "eastus2"

# bot1 (host 001) creates the room; the remaining 4 bot sessions join the
# same room, staggered 3s apart, one each across hosts 002-005.
[[actions]]
id = "room0"
type = "bot.create_room"
timestamp = "+0s"
host = "001"
media_mode = "both"

[[actions]]
id = "room0_h002_1"
type = "bot.join_room"
timestamp = "+3s"
host = "002"
room_id = "$room0.roomId"
media_mode = "both"

[[actions]]
id = "room0_h003_1"
type = "bot.join_room"
timestamp = "+6s"
host = "003"
room_id = "$room0.roomId"
media_mode = "both"

[[actions]]
id = "room0_h004_1"
type = "bot.join_room"
timestamp = "+9s"
host = "004"
room_id = "$room0.roomId"
media_mode = "both"

[[actions]]
id = "room0_h005_1"
type = "bot.join_room"
timestamp = "+12s"
host = "005"
room_id = "$room0.roomId"
media_mode = "both"

# Teardown: all 5 bot sessions leave 20 minutes in.
[[actions]]
type = "bot.delete_room"
timestamp = "+400s"
host = "001"
bot_id = "$room0.botId"

[[actions]]
type = "bot.delete_room"
timestamp = "+400s"
host = "002"
bot_id = "$room0_h002_1.botId"

[[actions]]
type = "bot.delete_room"
timestamp = "+400s"
host = "003"
bot_id = "$room0_h003_1.botId"

[[actions]]
type = "bot.delete_room"
timestamp = "+400s"
host = "004"
bot_id = "$room0_h004_1.botId"

[[actions]]
type = "bot.delete_room"
timestamp = "+400s"
host = "005"
bot_id = "$room0_h005_1.botId"
