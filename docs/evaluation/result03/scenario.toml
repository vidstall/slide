# Simple stress test: 15 core workers over 5 Azure instances (1 relay + 1
# cp-daemon + 1 validator-daemon per host), plus 5 bots (1 session per bot
# WORKER -- apps/bot supports multiple live sessions per process, see
# bot_client.list_sessions()'s docstring, but this scenario only needs one
# each) all joining ONE room. Bots hold the room for 20 minutes (+400s) then
# leave. No chaos/kill actions.
#
# Same topology as scenario/evaluation/simple-15wk-5host-20bot.toml -- only
# the bot session count/action list differs (5 sessions, 1 per host, instead
# of 20/4-per-host).
#
# Regions/size: reuses the 5 confirmed-working Azure regions from
# scenario/example/azure.toml (eastus/westus2/centralus/westeurope/eastus2),
# Standard_D2als_v7 -- one host per region keeps each region at 2 vCPU, under
# this subscription's 3-vCPU-per-region cap (worker count doesn't affect
# vCPU usage, only VM size/count does -- all workers on a host share one VM).

name = "simple-15wk-5host-5bot"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

[registry]
provider = "digitalocean"
tag = ""

[[frontends]]
name = "site-2-bucket"
object = "frontend"
provider = "alibaba"

# --- host 001 (eastus) ---
[[workers]]
host = "001"
service = "relay"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "eastus"

[[workers]]
host = "001"
service = "cp-daemon"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "eastus"

[[workers]]
host = "001"
service = "validator-daemon"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "eastus"

[[workers]]
host = "001"
service = "bot"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "eastus"

