size = "Standard_D2als_v7"
worker_index = 1
region = "eastus2"

# bot1 (host 001) creates the room; the one other bot session (host 002)
# joins it 3s later.
[[actions]]
id = "room0"
type = "bot.create_room"
timestamp = "+0s"
host = "001"
media_mode = "both"

[[actions]]
id = "room0_h002_1"
type = "bot.join_room"
timestamp = "+3s"
host = "002"
room_id = "$room0.roomId"
media_mode = "both"

# Teardown: both bot sessions leave 20 minutes in.
[[actions]]
type = "bot.delete_room"
timestamp = "+400s"
host = "001"
bot_id = "$room0.botId"

[[actions]]
type = "bot.delete_room"
timestamp = "+400s"
host = "002"
bot_id = "$room0_h002_1.botId"
