# Simple stress test: 15 core workers over 5 Azure instances (1 relay + 1
# cp-daemon + 1 validator-daemon per host), plus 2 bots joining ONE room.
# Bots hold the room for 20 minutes (+400s) then leave. No chaos/kill
# actions.
#
# Same topology as scenario/evaluation/simple-15wk-5host-20bot.toml -- only
# the bot session count/action list differs (2 sessions, one each on hosts
# 001/002, instead of 20/4-per-host). The full 5-host core-worker topology is
# still deployed even though only 2 of the 5 bot workers are ever used, so
# this scenario satisfies the same on-chain role minimums (>=2 relays, >=2
# validators, >=3 CPs per room -- see services/contract's constants.move) as
# the larger sibling scenarios and stays directly comparable to them.
#
# Regions/size: reuses the 5 confirmed-working Azure regions from
# scenario/example/azure.toml (eastus/westus2/centralus/westeurope/eastus2),
# Standard_D2als_v7 -- one host per region keeps each region at 2 vCPU, under
# this subscription's 3-vCPU-per-region cap (worker count doesn't affect
# vCPU usage, only VM size/count does -- all workers on a host share one VM).

name = "simple-15wk-5host-2bot"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

[registry]
provider = "digitalocean"
tag = ""

[[frontends]]
name = "site-2-bucket"
object = "frontend"
provider = "alibaba"

# --- host 001 (eastus) ---
[[workers]]
host = "001"
service = "relay"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "eastus"

[[workers]]
host = "001"
service = "cp-daemon"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "eastus"

[[workers]]
host = "001"
service = "validator-daemon"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "eastus"

[[workers]]
host = "001"
service = "bot"
provider = "azure"
size = "Standard_D2als_v7"
worker_index = 1
region = "eastus"

