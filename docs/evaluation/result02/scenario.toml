# Stress test: 10 Azure instances (1 relay + 2 cp-daemon + 2 validator-daemon +
# 1 bot each = 60 workers total, 50 of them killable -- see KILLABLE_SERVICES in
# cli/scenario/gen_eval_scenarios.py, which excludes bot/node_exporter).
# 20 bots (2 concurrent sessions per bot WORKER -- apps/bot supports multiple
# live sessions per process, see bot_client.list_sessions()'s docstring) all join
# ONE room, then every 2 minutes exactly one more killable worker is stopped
# (worker.leave), continuing until 25 of the 50 killable workers (50%) are down.
#
# Base topology: scenario/example/azure.toml, extended from 5 hosts/regions to 10.
# Regions eastus/westus2/centralus/westeurope/eastus2 (hosts 001-005) are confirmed
# working for this subscription at Standard_D2als_v7 (see azure.toml's own
# comments). Of the 5 new regions (hosts 006-010): japaneast/southeastasia (008/
# 009) also work at _v7; uksouth (007) and canadacentral (010) rejected _v7
# (SkuNotAvailable / InvalidParameter respectively) but succeeded at
# Standard_D2als_v6 -- confirmed live via `scenario apply`. northeurope (006)
# rejected BOTH _v7 and _v6 with SkuNotAvailable/"Capacity Restrictions" on two
# separate live apply attempts -- a genuine region-wide capacity shortage for
# this VM family, not fixable by swapping SKU generation -- so host 006 was
# moved to swedencentral (Standard_D2als_v7, unused by any other host) instead.
#
# Kill order/timing: the 25 killed (of 50 killable) workers were chosen via the same
# method cli/scenario/gen_eval_scenarios.py's _select_kill_targets() uses --
# random.Random(0).sample(killable_pool, 25) over this file's own [[workers]] in
# declaration order -- but that generator only supports a single kill wave (one
# --kill-at timestamp), not this file's repeating "one more every 2 minutes"
# cadence, so this file is hand-composed rather than machine-generated. Reproduce
# the same order (seed=0) with the worker list this file declares if regenerating.

name = "azure-50wk-10bot-1room"
env = "devnet"

[contract]
gas_budget = ""
create_registry_if_missing = false
force = false

# Reuse the DigitalOcean-hosted registry, same as scenario/example/azure.toml.
[registry]
provider = "digitalocean"
tag = ""

[[frontends]]
name = "site-2-bucket"
object = "frontend"
provider = "alibaba"

